name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax check and scheduler regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the SPA has no dependencies and the tests deliberately
      # run on Node's built-in test runner, lifting the scheduling functions
      # straight out of the sources rather than importing express/hono.
      - name: Syntax check backends
        run: npm run check

      - name: Scheduler regression tests
        run: npm test
