name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax check and scheduler regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the SPA has no dependencies and the tests deliberately
      # run on Node's built-in test runner, lifting the scheduling functions
      # straight out of the sources rather than importing express/hono.
      - name: Syntax check backends
        run: npm run check

      - name: Scheduler regression tests
        run: npm test

      # Hits the live production hosts hardcoded into index.html's API_BASE.
      # Added after a 2026-11-26 outage where a Worker custom-domain route
      # retired the old workers.dev subdomain but index.html kept pointing at
      # it, and nothing in CI caught it until a user reported every API call
      # failing. Separate from `npm test`, which is deliberately network-free.
      - name: Production smoke test
        run: npm run test:smoke
