<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badminton Rotation Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#172D2D;--ph:#004C45;--ia:#128BA6;
  --nav:#D5EBDB;--s0:#FFFFFF;--s1:#F2F2F2;--s2:#E5E5E5;
  --bd:#D2D2D2;--bdm:#808080;
  --tx:#121212;--txs:#666666;--txm:#404040;--txd:#BFBFBF;
  --ok:#004C45;--oks:#D5EBDB;
  --wa:#F7C11B;--was:#FFE999;
  --er:#BB363C;--ers:#F1D7D9;
  --bls:#D3EDF6;--blb:#128BA6;
}
body{background:var(--s1);font-family:'Libre Franklin',sans-serif;min-height:100vh}
.app{max-width:916px;margin:0 auto;padding:16px}
.hdr{background:#172D2D;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;height:60px}
.hdr-inner{max-width:916px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;gap:14px}
.tabs{display:flex;background:#FFFFFF;border-radius:8px 8px 0 0;border-bottom:2px solid #E5E5E5;box-shadow:0 1px 3px rgba(18,18,18,0.06);margin-bottom:24px}
.tab{padding:13px 20px;border:none;background:none;font-size:13px;font-weight:500;color:#666666;cursor:pointer;font-family:'Libre Franklin',sans-serif;line-height:1}
.tab:hover{color:#121212}
.tab.active{color:#172D2D;font-weight:600;border-bottom:2px solid #172D2D;margin-bottom:-2px}
.card{background:var(--s0);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(18,18,18,0.06),0 1px 2px rgba(18,18,18,0.04)}
.slabel{font-size:11px;color:var(--txs);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--tx);min-width:130px;font-weight:500}
input[type=number]{width:78px;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:13px;font-family:'Libre Franklin',sans-serif;color:var(--tx);background:var(--s0)}
input[type=number]:focus{outline:none;border-color:#128BA6;box-shadow:0 0 0 3px rgba(18,139,166,0.20)}
input[type=text]{border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-family:'Libre Franklin',sans-serif;color:var(--tx);background:var(--s0);width:100%}
input[type=text]:focus{outline:none;border-color:#128BA6;box-shadow:0 0 0 3px rgba(18,139,166,0.20)}
textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12px;font-family:'Libre Franklin',monospace;color:var(--tx);background:var(--s1);width:100%;resize:vertical;min-height:110px}
textarea:focus{outline:none;border-color:#128BA6;box-shadow:0 0 0 3px rgba(18,139,166,0.20)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:28px}
.pchip{display:inline-flex;align-items:center;gap:3px;padding:4px 9px 4px 11px;border-radius:4px;font-size:12px;font-weight:500;background:var(--nav);border:1px solid #B4E1C1;color:var(--ph);line-height:1.4}
.pchip .rm{cursor:pointer;color:#316E68;font-size:14px;padding-left:4px;line-height:1;opacity:0.75}
.pchip .rm:hover{color:var(--er);opacity:1}
.add-row{display:flex;gap:8px;margin-bottom:6px}
.add-row input{flex:1}
.hint{font-size:12px;color:var(--txs);margin-top:4px}
.info-hint{font-size:12px;color:#0E687D;background:var(--bls);border:1px solid var(--blb);border-radius:4px;padding:6px 10px;margin-top:6px;display:block}
.err-hint{font-size:12px;color:var(--er);font-weight:500}
.import-area{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.import-area label{font-size:12px;color:var(--txs)}
.conflict-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cx{padding:6px 13px;border-radius:4px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--bd);background:#FFFFFF;color:#121212;font-family:'Libre Franklin',sans-serif;line-height:1.4}
.cx:hover{border-color:#128BA6;color:#128BA6}
.cx.on{background:#172D2D;color:#FFFFFF;border-color:#172D2D}
.conflict-summary{font-size:13px;color:var(--txs);margin-top:6px;min-height:20px}
.conflict-summary strong{color:var(--tx);font-weight:600}
.btn-p{background:#172D2D;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Libre Franklin',sans-serif}
.btn-p:hover{background:#253C3C}
.btn-s{background:var(--s0);color:var(--tx);border:1px solid var(--bdm);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Libre Franklin',sans-serif;font-weight:500}
.btn-s:hover{background:var(--s1)}
.btn-s.active{background:var(--ia);color:#fff;border-color:var(--ia)}
.btn-danger{background:var(--s0);color:var(--er);border:1px solid #D2D2D2;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Libre Franklin',sans-serif;font-weight:500}
.btn-danger:hover{background:var(--ers);border-color:var(--er)}
.btn-extend{background:#172D2D;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Libre Franklin',sans-serif;width:100%}
.btn-extend:hover{background:#253C3C}
.extend-box{background:var(--s0);border:1px solid var(--bd);border-radius:8px;padding:24px;margin-bottom:1rem;text-align:center}
.extend-box p{font-size:13px;color:var(--txs);margin-bottom:10px}
.checkin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.checkin-head .slabel{margin-bottom:0}
.checkin-all-btn{background:var(--ok);border-color:var(--ok)}
.checkin-all-btn:hover{opacity:.9}
.checkin-chips{display:flex;flex-wrap:wrap;gap:8px}
.checkin-chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:var(--s1);color:var(--tx);font-family:'Libre Franklin',sans-serif;line-height:1.3;min-height:44px;user-select:none;transition:background .12s,border-color .12s,color .12s}
.checkin-chip .ci-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--bdm)}
.checkin-chip.status-not_arrived{background:var(--s1);color:var(--txs);border-color:var(--bdm)}
.checkin-chip.status-not_arrived .ci-dot{background:var(--bdm)}
.checkin-chip.status-playing{background:var(--oks);color:var(--ok);border-color:var(--ok)}
.checkin-chip.status-playing .ci-dot{background:var(--ok)}
.checkin-chip.status-left{background:var(--ers);color:var(--er);border-color:var(--er);text-decoration:line-through;text-decoration-thickness:2px}
.checkin-chip.status-left .ci-dot{background:var(--er)}
.checkin-legend{font-size:12px;color:var(--txs);margin-top:8px}
.checkin-edit-btn.active{background:var(--ia);color:#fff;border-color:var(--ia)}
.checkin-name-input{font:inherit;font-size:13px;font-weight:600;font-family:'Libre Franklin',sans-serif;border:1.5px solid var(--ia);border-radius:10px;padding:10px 14px;min-height:44px;width:140px;background:var(--s0);color:var(--tx)}
.checkin-add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.checkin-add-input{font:inherit;font-size:13px;font-family:'Libre Franklin',sans-serif;border:1.5px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px;flex:1;min-width:160px;background:var(--s0);color:var(--tx)}
.rnav{display:flex;align-items:center;gap:12px;margin-bottom:1rem;background:var(--s0);border:1px solid var(--bd);border-radius:8px;padding:10px 16px}
.rnav .rlabel{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--tx)}
.session-summary{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--txs);margin:-4px 0 12px}
.session-summary span{display:inline-flex;align-items:center;gap:5px}
.session-summary i{font-size:13px}
.val-badge{font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:10px}
.val-badge.ok{background:var(--oks);color:var(--ok)}
.val-badge.warn{background:var(--was);color:#7A5D00}
.sub-banner{background:var(--was);border:1px solid var(--wa);border-radius:6px;padding:10px 16px;color:var(--tx);font-size:13px;font-weight:600;margin-bottom:.75rem}
.sub-banner span{font-weight:400}
.courts-grid{display:grid;gap:12px;margin-bottom:1rem}
.courts-grid.edit-mode{outline:2px dashed var(--ia);outline-offset:8px;border-radius:10px;background:rgba(18,139,166,0.06);padding:8px}
.edit-round-btn{background:none;border:none;color:var(--txs);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.edit-round-btn:hover{color:var(--ia);background:rgba(18,139,166,0.1)}
.edit-round-btn.active{color:#fff;background:var(--ia)}
.edit-hint{font-size:12px;color:var(--ia);text-align:center;margin:-6px 0 10px;font-weight:600}
.pa.swappable,.pb.swappable,.sub-chip.swappable{cursor:pointer;border:1.5px dashed transparent;user-select:none}
.pa.swappable:hover,.pb.swappable:hover,.sub-chip.swappable:hover{border-color:var(--ia)}
.pa.swap-selected,.pb.swap-selected,.sub-chip.swap-selected{border-color:var(--ia)!important;border-style:solid!important;box-shadow:0 0 0 2px rgba(18,139,166,0.35)}
.sub-chip{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:600}
.court-card{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--s0)}
.court-card.singles{border-color:#7BC8E2}
.ch{background:#172D2D;padding:9px 14px;display:flex;align-items:center;gap:8px}
.court-card.singles .ch{background:#0E687D}
.ch .cn{background:#004C45;color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:3px}
.court-card.singles .ch .cn{background:#128BA6}
.ch .tag-s{background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;margin-left:2px}
.cb{padding:14px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.team{display:flex;flex-direction:column;gap:4px;align-items:flex-start}

.vs{font-size:12px;color:var(--txs);text-align:center;font-weight:600}
.pa{display:inline-block;padding:4px 11px;border-radius:4px;font-size:12px;font-weight:600;background:#EEF7F1;color:#004C45;margin-bottom:2px}
.pb{display:inline-block;padding:4px 11px;border-radius:4px;font-size:12px;font-weight:600;background:#D3EDF6;color:#00598C;margin-bottom:2px}
.stats-tbl{width:100%;font-size:12px;border-collapse:collapse;table-layout:fixed}
.stats-tbl th{font-size:11px;color:var(--txs);font-weight:600;text-align:left;padding:5px 7px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.05em}
.stats-tbl td{padding:5px 7px;border-bottom:1px solid var(--bd);color:var(--tx);font-size:12px}
.stats-tbl tr:last-child td{border-bottom:none}
.stats-tbl tbody tr:hover td{background:var(--s1)}
.badge-in{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;background:#D5EBDB;color:#004C45}
.badge-out{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;background:#FFE999;color:#7a4e00}
.vrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px;color:var(--tx)}
.vrow:last-child{border-bottom:none}
.dok{width:8px;height:8px;border-radius:50%;background:#004C45;flex-shrink:0}
.derr{width:8px;height:8px;border-radius:50%;background:var(--er);flex-shrink:0}
details summary{font-size:13px;color:var(--txs);cursor:pointer;user-select:none;padding:2px 0;font-weight:500}
details summary:hover{color:var(--ia)}
.btn-icon-hdr{background:none;border:none;color:rgba(255,255,255,.65);font-size:20px;cursor:pointer;padding:0;border-radius:6px;line-height:1;transition:all .15s;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-icon-hdr:hover{color:#fff;background:rgba(255,255,255,.12)}
.btn-icon-hdr.active{color:#fff;background:rgba(255,255,255,.12)}
.lang-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--s0);border:1px solid var(--bd);border-radius:8px;box-shadow:0 4px 8px rgba(18,18,18,0.10),0 8px 16px rgba(18,18,18,0.08);min-width:200px;z-index:200;overflow:hidden}
.lang-menu button{display:block;width:100%;padding:9px 14px;border:none;background:none;text-align:left;font-size:13px;font-family:'Libre Franklin',sans-serif;color:var(--tx);cursor:pointer}
.lang-menu button:hover{background:var(--s1)}
.lang-menu button.active{font-weight:600;color:#172D2D}
body.dark-mode{
  --s0:#141F1E;--s1:#0F1A19;
  --bd:#334542;--bdm:#5A7570;
  --tx:#F2F2F2;--txs:#A6A6A6;--txm:#D2D2D2;--txd:#666666;
  --nav:#1A3A2E;--ok:#6BC699;--oks:#1A3A2E;
  --wa:#FFD700;--was:#332200;
  --er:#FF8A8F;--ers:#4D2A2D;
  --bls:#0F3A45;--blb:#4CB8D4;
}
body.dark-mode .pa{background:#1A3A2E;color:#6BC699}
body.dark-mode .pb{background:#0F3A45;color:#4CB8D4}
body.dark-mode .tabs{background:var(--s0);border-color:var(--bd)}
body.dark-mode .tab.active{color:var(--tx);border-color:var(--tx)}
body.dark-mode .sub-banner{background:var(--was);color:var(--wa);border-color:var(--wa)}
body.dark-mode .badge-in{background:#1A3A2E;color:#6BC699}
body.dark-mode .badge-out{background:#332200;color:#FFD700}
body.dark-mode .cx{background:var(--s0)}
body.dark-mode .lang-menu button.active{color:var(--tx)}
body.dark-mode .info-hint{color:var(--blb);background:var(--bls);border-color:var(--blb)}
.hdr-tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qr-anchor{position:relative}
.qr-popover{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 24px));background:var(--s0);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 24px rgba(18,18,18,0.16),0 2px 6px rgba(18,18,18,0.08);padding:14px;z-index:240;max-height:calc(100vh - 86px);overflow:auto}
.qr-popover .slabel{margin-bottom:8px}
.qr-popover .hint{margin-bottom:8px}
.ctry-slot{width:100%;height:18px;margin:2px 0 5px;display:flex;align-items:center}
.ctry-sep{display:flex;align-items:center;gap:5px;width:100%;margin:0}
.ctry-gap{visibility:hidden}
.sep-ln{flex:1;height:1px;background:#B8DFC4}
.sep-tx{font-size:9px;font-weight:700;color:#316E68;white-space:nowrap;letter-spacing:.02em;font-family:var(--font-sans)}
body.dark-mode .sep-ln{background:#253C3C}
body.dark-mode .sep-tx{color:#4A8070}
@media(max-width:600px){
  .courts-grid{grid-template-columns:1fr !important}
  .modal-content{width:95%}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-bottom:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex-shrink:0;padding:12px 16px}
  .session-summary{gap:10px 14px;font-size:11px}
}
.hdr-a{text-decoration:none;color:inherit;transition:opacity .15s}
.hdr-a:hover{opacity:.7}
.hdr-titlewrap{flex:1;min-width:0;overflow:hidden}
.hdr-title{font-size:14px;font-weight:600;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-subtitle{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){
  .hdr-inner{gap:8px}
  .hdr-brandwrap{gap:8px}
  .hdr-subtitle-label{display:none}
  .hdr-divider{display:none}
  .btn-icon-hdr{width:32px;height:32px;font-size:18px}
  .hdr-tools{gap:2px}
}
@media(max-width:360px){
  .hdr-title{font-size:12.5px}
}
</style>
</head>

  const locale=COUNTRY_LOCALES[currentLanguage]||'en';
  try{
    if(typeof Intl!=='undefined'&&typeof Intl.DisplayNames==='function'){
      let formatter=countryNameFormatters[locale];
      if(!formatter){

function t(key,vars={}){const str=i18n[currentLanguage]?.[key]||i18n.en[key]||key;let result=str;Object.entries(vars).forEach(([k,v])=>{result=result.replace(`{${k}}`,v);});return result;}
function translateUI(){document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.getAttribute('data-i18n');const type=el.getAttribute('data-i18n-type')||'text';if(type==='text'){el.textContent=t(key);}else if(type==='placeholder'){el.placeholder=t(key);}else if(type==='title'){el.title=t(key);}});}
function getShareBaseUrl(){return location.protocol==='file:'?'https://trulioo-badminton.onrender.com':location.origin;}
function toggleTheme(){setTheme(document.body.classList.contains('dark-mode')?'light':'dark');}
function updateQrToggleState(){
  const btn=document.getElementById('qr-toggle');
  const pop=document.getElementById('qr-popover');
  if(btn){
    const label=t(currentQrPopoverOpen?'hideQr':'showQr');
    btn.title=label;
    btn.setAttribute('aria-label',label);
    btn.setAttribute('aria-expanded',currentQrPopoverOpen?'true':'false');
  }
  if(pop)pop.style.display=currentQrPopoverOpen?'block':'none';
}
function setQrPopover(open){
  currentQrPopoverOpen=!!open;
  if(currentQrPopoverOpen)closeLangMenu();
  updateQrToggleState();
}
function toggleQrPopover(){setQrPopover(!currentQrPopoverOpen);}
function closeQrPopover(){setQrPopover(false);}
function toggleLangMenu(){
  closeQrPopover();
  const m=document.getElementById('lang-menu');
  m.style.display=m.style.display==='none'?'block':'none';
}
function closeLangMenu(){document.getElementById('lang-menu').style.display='none';}
document.addEventListener('click',e=>{
  if(!e.target.closest('#lang-menu')&&!e.target.closest('.btn-icon-hdr[onclick*="toggleLangMenu"]')){
    closeLangMenu();
  }
  if(!e.target.closest('#qr-popover')&&!e.target.closest('#qr-toggle')){
    closeQrPopover();
  }
  const btn=e.target.closest('[data-action]');
  if(btn&&btn.dataset.action==='setQrStyle')setQrStyle(btn.dataset.style);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLangMenu();closeQrPopover();}});
function setTheme(t){
  localStorage.setItem('theme',t);
  const icon=document.getElementById('theme-icon');
  if(t==='dark'){
    document.body.classList.add('dark-mode');
    if(icon)icon.className='ti ti-moon';
  }else{
    document.body.classList.remove('dark-mode');
    if(icon)icon.className='ti ti-sun';
  }
}
function setLanguage(lang){
  currentLanguage=normalizeLanguage(lang);
  localStorage.setItem('language',currentLanguage);
  document.querySelectorAll('.lang-option').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===currentLanguage));
  translateUI();
  updateQrToggleState();
  renderAll();
  if(schedule.length)renderSchedule();
}
function loadSettings(){
  const theme=localStorage.getItem('theme')||'light';
  const lang=normalizeLanguage(localStorage.getItem('language'));
  setTheme(theme);
  setLanguage(lang);
}
function markScheduleAsShared(){
  isScheduleShared=true;
  document.getElementById('shared-banner').style.display='block';
  const now=new Date().toLocaleTimeString();
  document.getElementById('shared-time').textContent=`at ${now}`;
  document.getElementById('extend-box').style.display='none';
}
function getScheduleRevision(sch){const revision=Number(sch&&sch.revision);return Number.isFinite(revision)&&revision>=0?revision:0;}
function closeScheduleStream(){
  if(currentScheduleStream){
    currentScheduleStream.onopen=null;
    currentScheduleStream.onmessage=null;
    currentScheduleStream.onerror=null;
    currentScheduleStream.close();
  }
  currentScheduleStream=null;
  currentScheduleStreamCode='';
}
function applyScheduleSnapshot(sch,{preserveRound=false}={}){
  const previousRound=currentRound;
  editingRound=null;editSelectedSlot=null;editHasUnsyncedSwap=false;
  rawPlayers=(sch.players||[]).map(p=>typeof p==='string'?p:p.name).filter(Boolean);
  conflictGroup=new Set(Array.isArray(sch.conflictGroup)?sch.conflictGroup:[]);
  schedule=Array.isArray(sch.rounds)?sch.rounds:[];
  currentLayout=sch.layout||null;
  currentNc=sch.numCourts||((currentLayout&&typeof currentLayout.doubles==='number')?(currentLayout.doubles+currentLayout.singles):0);
  currentScheduleRevision=getScheduleRevision(sch);
  currentScheduleUpdatedAt=sch.updatedAt||sch.generatedAt||null;
  document.getElementById('num-courts').value=currentNc||'';

  attendance=Object.fromEntries(rawPlayers.map(p=>[p,'playing']));
  rebuildSchedulingState();
  renderAll();
  currentRound=preserveRound?Math.max(0,Math.min(previousRound,schedule.length-1)):0;
  renderSchedule();
  renderCheckIn();
}

async function pollCurrentSchedule(){
  try{
    const res=await fetch(`${API_BASE}/api/schedule/current`);
    if(!res.ok)return;
    const data=await res.json();
    const sch=data.schedule;
    if(!sch)return;
    if(sch.code!==currentShareCode){
      applyScheduleSnapshot(sch,{preserveRound:false});
      currentShareCode=sch.code;
      applyCurrentLinkShareDisplay();
      setScheduleStream(currentShareCode);
    }else if(getScheduleRevision(sch)>currentScheduleRevision){
      applyScheduleSnapshot(sch,{preserveRound:true});
    }
  }catch(e){/* silent — will retry on next poll */}
}

async function refreshSharedSchedule({force=false}={}){
  if(!currentShareCode)return false;

  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  const sch=data.schedule||{};
  const nextRevision=getScheduleRevision(sch);
  if(!force&&nextRevision<=currentScheduleRevision)return false;

function onScheduleStreamEvent(event){
  try{
    const payload=JSON.parse(event.data||'{}');
    if(!payload||payload.code!==currentShareCode)return;
    if(getScheduleRevision(payload)<=currentScheduleRevision)return;
    refreshSharedSchedule().catch(()=>{});
  }catch(_err){}
}
function setScheduleStream(code){
  if(!code||typeof EventSource==='undefined'){
    closeScheduleStream();
    return;
  }
  if(currentScheduleStreamCode===code&&currentScheduleStream)return;
  closeScheduleStream();
  const stream=new EventSource(`${API_BASE}/api/schedule/${encodeURIComponent(code)}/stream`);
  currentScheduleStream=stream;
  currentScheduleStreamCode=code;
  stream.onopen=()=>{if(code===currentShareCode)refreshSharedSchedule().catch(()=>{});};
  stream.addEventListener('schedule-updated',onScheduleStreamEvent);
  stream.addEventListener('schedule-shared',onScheduleStreamEvent);
  stream.onerror=()=>{};
}

function computeDisplayNames(list){
  const fc={};
  list.forEach(r=>{const f=r.split(/\s+/)[0];fc[f]=(fc[f]||0)+1;});
  const map={};
  list.forEach(r=>{const p=r.split(/\s+/);map[r]=(fc[p[0]]>1&&p.length>1)?p[0]+' '+p[1][0]+'.':p[0];});
  return map;
}

function getLayout(n,nc){
  if(n<nc*2)return null;
  for(let s=0;s<=3;s++){
    const a=n-s;if(a<nc*2)break;
    const r=a%4;
    if(r===0){const d=a/4;if(d===nc)return{doubles:nc,singles:0,subs:s};if(d>nc)return{doubles:nc,singles:0,subs:s+(d-nc)*4};}
    if(r===2){const d=Math.floor(a/4);if(d+1<=nc)return{doubles:d,singles:1,subs:s};}
  }
  if(n>=nc*4)return{doubles:nc,singles:0,subs:n-nc*4};
  for(let s=0;s<=n-nc*2;s++){const a=n-s,r=a%4;if(r===0||r===2){return{doubles:Math.floor(a/4),singles:r===2?1:0,subs:s};}}
  return{doubles:0,singles:nc,subs:n-nc*2};
}

  return s.split(/\s+/).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ')||null;
}

function getCountryDemoRoster(limit){
  const max=Math.max(1,Math.min(50,parseInt(limit,10)||0));
  const grouped=new Map();
  Object.entries(countryLookup).forEach(([name,code])=>{
    const cc=String(code||'').trim().toUpperCase();
    if(!/^[A-Z]{2}$/.test(cc))return;
    if(!grouped.has(cc))grouped.set(cc,[]);
    grouped.get(cc).push(name);
  });
  grouped.forEach(names=>names.sort((a,b)=>a.localeCompare(b)));
  const selected=[];
  const pushName=name=>{if(name&&!selected.includes(name)&&selected.length<max)selected.push(name);};
  COUNTRY_DEMO_PRIORITY.forEach(code=>{
    const names=grouped.get(code)||[];
    if(names.length>=2){
      pushName(names[0]);
      pushName(names[1]);
    }
  });
  if(selected.length<max){
    const leftovers=[];
    COUNTRY_DEMO_PRIORITY.forEach(code=>{
      const names=grouped.get(code)||[];
      names.slice(2).forEach(name=>leftovers.push(name));
    });
    grouped.forEach((names,code)=>{
      if(COUNTRY_DEMO_PRIORITY.includes(code))return;
      names.forEach(name=>leftovers.push(name));
    });
    leftovers.sort((a,b)=>{
      const ac=resolvePlayerCountry(a),bc=resolvePlayerCountry(b);
      const ai=COUNTRY_DEMO_PRIORITY.indexOf(ac);
      const bi=COUNTRY_DEMO_PRIORITY.indexOf(bc);
      const ap=ai===-1?999:ai;
      const bp=bi===-1?999:bi;
      if(ap!==bp)return ap-bp;
      return a.localeCompare(b);
    });
    leftovers.forEach(pushName);
  }
  return selected.slice(0,max);
}

// Reads every input in the chip row at once, applies whichever names actually
// changed, and skips (with a message) any edit that would collide with another
// player's name — so one bad edit doesn't block saving the rest.
function saveCheckinEdits(){
  const inputs=[...document.querySelectorAll('#checkin-chips .checkin-name-input')];
  if(!inputs.length){exitCheckinEditMode();return;}
  const proposals=inputs.map(inp=>{
    const oldName=inp.dataset.orig;
    const raw=inp.value.trim();
    const newName=raw?raw.split(/\s+/).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' '):oldName;
    return {oldName,newName};
  });
  const finalNames=proposals.map(p=>p.newName);
  const skipped=[];
  const applied=proposals.filter((p,i)=>{
    if(p.newName===p.oldName)return false;
    const dupIdx=finalNames.findIndex((n,ni)=>ni!==i&&n.toLowerCase()===p.newName.toLowerCase());
    if(dupIdx!==-1){skipped.push(p.newName);return false;}
    return true;
  });
  applied.forEach(({oldName,newName})=>renamePlayerRaw(oldName,newName));
  if(applied.length){
    rebuildSchedulingState();
    renderAll();
    renderSchedule();
    if(schedule.length)syncShareQr();
  }
  document.getElementById('checkin-msg').textContent=skipped.length?t('renameDuplicate',{name:skipped.join(', ')}):'';
  exitCheckinEditMode();
}
// Repoints every reference to a player's old name — roster, attendance, conflicts,
// demo tracking, and every round already generated (past and upcoming) — so a
// mid-session correction (typo, or a substitute taking over someone's slot)
// stays consistent everywhere instead of splitting the same person into two names.
// Pure state mutation with no rendering/sync side effects, so callers can batch
// several renames before re-rendering once.
function renamePlayerRaw(oldName,newName){
  const idx=rawPlayers.indexOf(oldName);
  if(idx===-1)return;
  rawPlayers[idx]=newName;
  if(conflictGroup.has(oldName)){conflictGroup.delete(oldName);conflictGroup.add(newName);}
  if(demoPlayers.has(oldName)){demoPlayers.delete(oldName);demoPlayers.add(newName);}
  attendance[newName]=attendance[oldName]||'playing';
  delete attendance[oldName];
  schedule.forEach(rnd=>{
    rnd.subs=rnd.subs.map(p=>p===oldName?newName:p);
    rnd.courts.forEach(ct=>{
      ct.a=ct.a.map(p=>p===oldName?newName:p);
      ct.b=ct.b.map(p=>p===oldName?newName:p);
    });
  });
}

  if(needsRegen)regenerateUpcomingRounds();

function regenerateUpcomingRounds(){
  if(!schedule.length||!currentLayout||!currentNc)return;
  const roster=playingRoster();
  const newLayout=getLayout(roster.length,currentNc);
  if(!newLayout)return;
  const keepCount=Math.max(0,Math.min(currentRound,schedule.length));
  const playedRounds=schedule.slice(0,keepCount);
  sitC=Object.fromEntries(rawPlayers.map(p=>[p,0]));
  pairHistory=createPairHistory();
  playedRounds.forEach(rnd=>{
    rnd.subs.forEach(p=>{if(p in sitC)sitC[p]++;});
    recordRound(pairHistory,rnd.courts);
  });
  currentLayout=newLayout;
  const upcomingCount=Math.max(0,schedule.length-keepCount);
  const regenerated=generateRounds(upcomingCount,roster);
  schedule=[...playedRounds,...regenerated];
  currentRound=Math.max(0,Math.min(currentRound,schedule.length-1));
  renderSchedule();
  renderCheckIn();
  syncShareQr();
}

const REPEAT_PARTNER_WEIGHT=1,REPEAT_OPPONENT_WEIGHT=0.6,CONSECUTIVE_OPPONENT_WEIGHT=3;

// Generic greedy minimum-cost perfect matching over an even-length list. Builds
// every candidate pair, shuffles first so equal-cost ties vary from run to run,
// then stable-sorts by cost and greedily accepts the cheapest pair whose two
// items are both still free. This is not a guaranteed-optimal assignment (a
// true optimum needs a full blossom algorithm), but for our small squared
// repeat costs it reliably beats random sampling once a group is bigger than a
// handful of players, and it runs in a single pass instead of hundreds of
// random restarts.
function greedyMatch(items,costFn){
  const pool=shuffle(items);
  const remaining=new Set(pool);
  const candidates=[];
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)candidates.push([pool[i],pool[j],costFn(pool[i],pool[j])]);
  candidates.sort((x,y)=>x[2]-y[2]);
  const pairs=[];
  candidates.forEach(([a,b,c])=>{
    if(c===Infinity)return;
    if(remaining.has(a)&&remaining.has(b)){pairs.push([a,b]);remaining.delete(a);remaining.delete(b);}
  });
  // Anything left over means every remaining option was forbidden -- pair them
  // off by lowest cost anyway, since a schedule must still be produced. This is
  // the only path that can leave a conflict-group pair together.
  const leftover=[...remaining];
  while(leftover.length>=2){
    const a=leftover.shift();
    let bestIdx=0,bestCost=Infinity;
    for(let i=0;i<leftover.length;i++){const c=costFn(a,leftover[i]);if(c<bestCost){bestCost=c;bestIdx=i;}}

}
// The single global conflict group behaves like one "no two of these may be
// teammates" clique. Matching its members first, while non-clique partners are
// still plentiful, is what actually guarantees zero conflict violations
// whenever a valid pairing exists -- a plain greedy pass over everyone can
// paint itself into a corner and force an avoidable violation just from bad
// luck in candidate order.
function matchPartnersRespectingConflicts(activePl,hist){
  const partnerCost=(a,b)=>{const n=hist.partners.get(pairKey(a,b))||0;return n*n*REPEAT_PARTNER_WEIGHT;};
  const cliqueActive=activePl.filter(p=>conflictGroup.has(p));
  if(cliqueActive.length<2)return greedyMatch(activePl,partnerCost);

  const nonClique=shuffle(activePl.filter(p=>!cliqueSet.has(p)));

  const pairs=[];

    const available=nonClique.filter(q=>!usedNonClique.has(q));
    if(!available.length)return;

  const leftoverClique=clique.filter(p=>!matchedClique.has(p));
  const leftoverNonClique=nonClique.filter(q=>!usedNonClique.has(q));
  pairs.push(...greedyMatch([...leftoverClique,...leftoverNonClique],partnerCost));

}
// Builds one round's courts: splits the active pool into the singles slots and
// the doubles pool, pairs up doubles partners with conflicts respected (above),
// then matches those partner-pairs against each other -- and matches singles
// opponents directly -- to minimize repeated opponents, with an extra penalty

function buildRoundCourts(activePl,layout,hist){

  };

  document.getElementById('lb-sessions').style.display=v==='sessions'?'block':'none';
  document.getElementById('lb-player').style.display=v==='player'?'block':'none';
  document.getElementById('lb-view-players').classList.toggle('active',v==='players');
  document.getElementById('lb-view-sessions').classList.toggle('active',v==='sessions');
  if(v==='sessions')loadSessions();
}
async function loadSessions(){
  const tbl=document.getElementById('sessions-tbl');
  try{
    const res=await fetch(`${API_BASE}/api/sessions`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const {sessions}=await res.json();
    if(!sessions.length){tbl.innerHTML=`<tbody><tr><td>${t('noSessions')}</td></tr></tbody>`;return;}
    tbl.innerHTML=`<thead><tr><th>${t('sessionDate')}</th><th>${t('sessionPlayers')}</th></tr></thead><tbody>`+
      sessions.map(s=>`<tr style="cursor:pointer" onclick="location.search='?scheduleCode=${s.code}'"><td style="font-weight:600">${s.date}</td><td>${s.playerCount}</td></tr>`).join('')+
      `</tbody>`;
  }catch(err){
    // The two deploy halves land ~22s apart, so an older Worker may not have
    // this route yet. Degrade quietly rather than showing an error.
    tbl.innerHTML=`<tbody><tr><td>${t('noSessions')}</td></tr></tbody>`;
  }
}
async function loadPlayerPage(name){
  const box=document.getElementById('lb-player');
  setLeaderboardView('player');
  box.innerHTML=`<div class="hint">${t('leaderboardLoading')}</div>`;
  try{
    const res=await fetch(`${API_BASE}/api/player/${encodeURIComponent(name)}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const {player:p}=await res.json();
    const list=(arr)=>arr.length?arr.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.count} ${t('timesLabel')}</td></tr>`).join(''):`<tr><td>—</td><td></td></tr>`;
    box.innerHTML=
      `<button class="btn-s" onclick="setLeaderboardView('players')" data-i18n="backToLeaderboard">${t('backToLeaderboard')}</button>`+
      `<div class="slabel" style="margin:12px 0 8px">${escapeHtml(p.name)}</div>`+
      `<div class="hint">${t('statSessions')}: ${p.sessions} · ${t('statPlayed')}: ${p.games} · ${t('statSatOut')}: ${p.sits}</div>`+
      `<div class="slabel" style="margin:14px 0 6px">${t('playedWith')}</div>`+
      `<table class="stats-tbl"><tbody>${list(p.partners)}</tbody></table>`+
      `<div class="slabel" style="margin:14px 0 6px">${t('neverPartnered')}</div>`+
      `<div class="hint">${p.neverPartnered.length?p.neverPartnered.map(escapeHtml).join(', '):'—'}</div>`+
      `<div class="slabel" style="margin:14px 0 6px">${t('playedAgainst')}</div>`+
      `<table class="stats-tbl"><tbody>${list(p.opponents)}</tbody></table>`;
  }catch(err){
    box.innerHTML=`<button class="btn-s" onclick="setLeaderboardView('players')">${t('backToLeaderboard')}</button>`+
      `<div class="hint" style="margin-top:12px">${t('playerNotFound')}</div>`;
  }
}
async function loadLeaderboard(){
  const statusEl=document.getElementById('lb-status');
  const tblEl=document.getElementById('leaderboard-tbl');
  statusEl.textContent=t('leaderboardLoading');
  tblEl.innerHTML='';
  try{
    const res=await fetch(`${API_BASE}/api/leaderboard`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    const rows=Array.isArray(data.leaderboard)?data.leaderboard:[];
    if(!rows.length){
      statusEl.textContent=t('leaderboardEmpty');
      return;
    }
    statusEl.textContent='';
    tblEl.innerHTML=`<thead><tr><th style="width:22%">${t('statPlayer')}</th><th>${t('statSessions')}</th><th>${t('statPlayed')}</th><th>${t('statSatOut')}</th><th>${t('statPartners')}</th><th>${t('statOpponents')}</th></tr></thead><tbody>`+
      rows.map(r=>`<tr style="cursor:pointer" onclick="loadPlayerPage(${JSON.stringify(r.name).replace(/"/g,'&quot;')})"><td style="font-weight:600">${escapeHtml(r.name)}</td><td>${r.sessions}</td><td><span class="badge-in">${r.games}</span></td><td>${r.sits?`<span class="badge-out">${r.sits}</span>`:'—'}</td><td>${r.uniquePartners}</td><td>${r.uniqueOpponents}</td></tr>`).join('')+
      `</tbody>`;
  }catch(err){
    statusEl.textContent=t('leaderboardError');
  }
}
async function loadScheduleFromCode(code){
  const err=document.getElementById('setup-err');
  const isCurrent=code==='current';
  try{
    const res=await fetch(`${API_BASE}/api/schedule/${encodeURIComponent(code)}`);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    const sch=data.schedule||{};
    applyScheduleSnapshot(sch);
    currentShareCode=sch.code||code;
    if(isCurrent){
      applyCurrentLinkShareDisplay();
      startCurrentLinkPolling();
    }else{
      stopCurrentLinkPolling();
      currentShareUrl=sch.shareUrl||`${location.origin}/?scheduleCode=${encodeURIComponent(currentShareCode)}`;
      currentQrDataUrl='';
      const status=document.getElementById('qr-status');
      const codeEl=document.getElementById('qr-code');
      const urlEl=document.getElementById('qr-url');
      if(status)status.textContent='Loaded from a shared schedule link.';
      if(codeEl)codeEl.textContent=`Code: ${currentShareCode}`;
      if(urlEl)urlEl.textContent=currentShareUrl;
      if(currentShareUrl)renderStyledQr(currentShareUrl);
    }
    setScheduleStream(currentShareCode);
    switchTab('schedule');
  }catch(e){
    if(err)err.textContent=`Could not load shared schedule: ${e.message}`;
    isSharedView=false;
    applySharedViewMode();
    renderAll();
    resetShareQr();
  }
}
async function initApp(){
  const versionLabel=document.getElementById('app-version-label');
  if(versionLabel)versionLabel.textContent=`· v${APP_VERSION}`;
  await loadBackendCountryLookup();
  loadSettings();
  const initialCode=new URLSearchParams(location.search).get('scheduleCode');
  if(initialCode){
    isSharedView=true;
    applySharedViewMode();
    await loadScheduleFromCode(initialCode);
  }else{
    renderAll();
    resetShareQr();
  }
  const initialPlayer=new URLSearchParams(location.search).get('player');
  if(initialPlayer){switchTab('leaderboard');loadPlayerPage(initialPlayer);}
}
initApp();
</script>
